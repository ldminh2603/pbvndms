services:
  webcore-spring-api:
    image: webcore-spring-api:local
    build:
      context: ../WebCore.SpringApi
      dockerfile: Dockerfile
    ports:
      - "${WEBCORE_SERVER_PORT:-51130}:8080"
    extra_hosts:
      - "corelocalhost:${WEBCORE_CORELOCALHOST_IP:-127.0.0.1}"
      - "${WEBCORE_LDAP_HOSTNAME:-dc01.ad.pbb.local}:${WEBCORE_LDAP_HOST_IP:-127.0.0.1}"
    environment:
      WEBCORE_CLUSTER_ENABLED: "${WEBCORE_CLUSTER_ENABLED:-false}"
      WEBCORE_DATABASE_PROVIDER: "${WEBCORE_DATABASE_PROVIDER:-POSTGRES}"
      WEBCORE_DATABASE_CONNECTION_STRING: "${WEBCORE_DATABASE_CONNECTION_STRING:-}"
      WEBCORE_REDIS_HOST: "${WEBCORE_REDIS_HOST:-127.0.0.1}"
      WEBCORE_REDIS_PORT: "${WEBCORE_REDIS_PORT:-6379}"
      WEBCORE_NOTIFICATION_REALTIME_ENABLED: "${WEBCORE_NOTIFICATION_REALTIME_ENABLED:-true}"
      WEBCORE_NOTIFICATION_REDIS_CHANNEL: "${WEBCORE_NOTIFICATION_REDIS_CHANNEL:-webcore:notification:events}"
      WEBCORE_CORS_ALLOWED_ORIGINS: "${WEBCORE_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3005}"
      WEBCORE_AUTH_COOKIE_SECURE: "${WEBCORE_AUTH_COOKIE_SECURE:-false}"
      WEBCORE_AUTH_COOKIE_SAME_SITE: "${WEBCORE_AUTH_COOKIE_SAME_SITE:-Lax}"
      WEBCORE_LOKI_ENABLED: "${WEBCORE_LOKI_ENABLED:-false}"
      WEBCORE_LOKI_ENDPOINT: "${WEBCORE_LOKI_ENDPOINT:-http://corelocalhost:3100/loki/api/v1/push}"
      WEBCORE_LOKI_SERVICE: "${WEBCORE_LOKI_SERVICE:-webcore-spring-api}"
      WEBCORE_LOKI_ENVIRONMENT: "${WEBCORE_LOKI_ENVIRONMENT:-development}"
      WEBCORE_PROMETHEUS_PUBLIC: "${WEBCORE_PROMETHEUS_PUBLIC:-true}"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}"
      WEBCORE_DMS_CLAMAV_HOST: "${WEBCORE_DMS_CLAMAV_HOST:-corelocalhost}"
      WEBCORE_DMS_CLAMAV_PORT: "${WEBCORE_DMS_CLAMAV_PORT:-3310}"
      WEBCORE_DMS_CLAMAV_CONNECT_TIMEOUT_MS: "${WEBCORE_DMS_CLAMAV_CONNECT_TIMEOUT_MS:-3000}"
      WEBCORE_DMS_CLAMAV_READ_TIMEOUT_MS: "${WEBCORE_DMS_CLAMAV_READ_TIMEOUT_MS:-30000}"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-20MB}"
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-20MB}"
      WEBCORE_DOMAIN_SERVICE_USERNAME: "${WEBCORE_DOMAIN_SERVICE_USERNAME:-}"
      WEBCORE_DOMAIN_SERVICE_PASSWORD: "${WEBCORE_DOMAIN_SERVICE_PASSWORD:-}"
      WEBCORE_DOMAIN_BASE_DN: "${WEBCORE_DOMAIN_BASE_DN:-}"
      WEBCORE_LDAPS_CERT_FILE: /run/webcore/ldaps/dc01-ad-pbb-local.cer
    volumes:
      - type: bind
        source: ${WEBCORE_LDAPS_CERT_HOST_PATH:-../WebCore.SpringApi/certs/dc01-ad-pbb-local.cer}
        target: /run/webcore/ldaps/dc01-ad-pbb-local.cer
        read_only: true
