apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webcore-auth-ingress
  namespace: webcore
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: webcore-webcore-auth-rewrite@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/webcore/auth/login
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 80

          - path: /api/webcore/auth/refresh
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 80

          - path: /api/webcore/auth/me
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 80
