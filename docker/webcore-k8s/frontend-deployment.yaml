apiVersion: apps/v1
kind: Deployment
metadata:
  name: webcore-frontend
  namespace: webcore

spec:
  replicas: 2

  selector:
    matchLabels:
      app: webcore-frontend

  template:
    metadata:
      labels:
        app: webcore-frontend

    spec:
      # Phan giai hostname trong Pod
      hostAliases:
        - ip: "172.68.69.95"
          hostnames:
            - "corelocalhostdb"
            - "corelocalhostapp"
            - "corelocalhosts3"

        # Active Directory LDAPS
        - ip: "172.68.68.94"
          hostnames:
            - "dc01.ad.pbb.local"

      # Chi chay tren Worker co label ingress-node=true
      nodeSelector:
        ingress-node: "true"

      # Uu tien chia deu Frontend tren 2 Worker
      # Neu 1 Worker tat, van cho phep chay tren Worker con lai
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: webcore-frontend

      containers:
        - name: frontend
          image: docker.io/library/webcore-client-new:local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 3001

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "3001"

            - name: HOSTNAME
              value: "0.0.0.0"

            # Next.js proxy goi Spring Backend qua Kubernetes Service
            - name: WEBCORE_API_URL
              value: "http://backend-service.webcore.svc.cluster.local"

          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
